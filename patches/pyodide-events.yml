id: ev-already-loaded
language: typescript
files: [src/js/load-package.ts]
metadata: { expect: 1 }
rule: { pattern: 'this.logStdout(`${$N} already loaded from ${$C}`)' }
fix: |-
  this.emitEvent("pkg:already_loaded", {
    pkg: $N,
    channel: $C,
  })
