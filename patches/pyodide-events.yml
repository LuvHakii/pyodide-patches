id: ev-failed
language: typescript
files: [src/js/load-package.ts]
metadata: { expect: 1 }
rule: { pattern: 'for (const [name, err] of failed) { $$$ }' }
fix: |-
  this.emitEvent("pkgs:failed", {
    pkgs: Array.from(failed.keys()).sort(),
    errors: Array.from(failed, ([name, err]) => ({
      name,
      message: err.message,
    })),
  });
