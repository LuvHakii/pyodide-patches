id: ev-add-emitEvent
language: typescript
files: [src/js/load-package.ts]
metadata: { expect: 1 }
rule:
  kind: method_definition
  pattern: $SELF
  has: { field: name, regex: ^logStderr$ }
  inside: { kind: class_body, inside: { kind: class_declaration, has: { field: name, regex: ^PackageManager$ } } }
fix: |-
  $SELF

  public emitEvent(type: string, ctx?: any) {
    if ("dispatchEvent" in globalThis)
      dispatchEvent(
        new CustomEvent("pyodide:pm", {
          detail: {
            type,
            ...ctx,
          },
        }),
      );
  }
