id: es-locateFile
language: typescript
files: [src/js/emscripten-settings.ts]
metadata: { expect: 1 }
rule:
  pattern: '(path: string) => config.indexURL + path'
  inside: { kind: pair, has: { field: key, regex: ^locateFile$ } }
fix: |-
  (path: string) => {
    if (path === "pyodide.asm.wasm") {
      return config.wasmURL;
    }
    throw new Error(`Unexpected call to locateFile("${path}")`);
  }
