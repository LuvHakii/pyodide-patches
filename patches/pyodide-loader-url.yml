id: py-doc-loadPyodide-example
language: typescript
files: [src/js/pyodide.ts]
metadata: { expect: 1 }
rule:
  kind: comment
  pattern: $SELF
  not: { regex: 'asmURL:' }
  precedes: { kind: export_statement, has: { kind: function_declaration, has: { field: name, regex: ^loadPyodide$ } } }
transform:
  NEW:
    replace:
      source: $SELF
      replace: '(\* +const pyodide = await loadPyodide\(\{\n)'
      by: "${1} *     asmURL: \"https://example.com/pyodide.asm.mjs\",\n *     wasmURL: \"https://example.com/pyodide.asm.wasm\",\n *     stdLibURL: \"https://example.com/python_stdlib.zip\",\n *     lockFileURL: \"https://example.com/pyodide-lock.json\",\n"
fix: $NEW
