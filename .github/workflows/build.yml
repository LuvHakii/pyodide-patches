name: build

on:
  workflow_dispatch:
    inputs:
      release:
        description: "Publish release <yyyymmdd-hhmm> UTC. Off = dry run, artifact only, 7 days."
        type: boolean
        default: false

concurrency:
  group: build
  cancel-in-progress: false

permissions:
  contents: write

env:
  EMSDK_NUM_CORES: 3
  EMCC_CORES: 3
  CCACHE_DIR: /tmp/ccache

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          submodules: true

      - name: pin
        id: pin
        run: |
          SHA=$(git rev-parse HEAD:pyodide)
          TAG=$(git ls-remote --tags https://github.com/pyodide/pyodide.git | grep "^$SHA" | cut -f2 | sed 's|refs/tags/||; s|\^{}$||' | tail -1 || true)
          if [ -z "$TAG" ]; then echo "pinned pyodide $SHA is not a release tag; pyodideRev must name a pyodide release"; exit 1; fi
          echo "sha=$SHA" >> "$GITHUB_OUTPUT"
          echo "rev=$TAG" >> "$GITHUB_OUTPUT"

      - name: install system dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y xxd libltdl-dev

      - name: ccache
        uses: hendrikmuhs/ccache-action@v1.2.24
        with:
          max-size: 2G

      - name: install uv
        uses: astral-sh/setup-uv@v5

      - name: cache source
        uses: actions/cache@v4
        with:
          path: pyodide
          key: pyodide-${{ steps.pin.outputs.sha }}-${{ hashFiles('patches/*', 'scripts/apply-rules.sh') }}

      - name: install python
        run: |
          PYVERSION=$(git -C pyodide grep 'export PYVERSION ?=' Makefile.envs | cut -d' ' -f4)
          uv venv --seed --python "$PYVERSION" $RUNNER_TEMP/venv
          echo "VIRTUAL_ENV=$RUNNER_TEMP/venv" >> "$GITHUB_ENV"
          echo "$RUNNER_TEMP/venv/bin" >> "$GITHUB_PATH"
          $RUNNER_TEMP/venv/bin/python -m pip install -r pyodide/requirements.txt

      - name: build
        run: bash scripts/build.sh

      - name: stage release
        run: |
          mkdir -p release
          cp pyodide/dist/{pyodide.mjs,pyodide.asm.mjs,pyodide.asm.wasm,pyodide.d.ts} release/
          PATCHES=$(basename -a patches/* | jq -R . | jq -s .)
          printf '{"pyodideRev":"%s","pyodideBaseCommit":"%s","patches":%s}' \
            "${{ steps.pin.outputs.rev }}" "${{ steps.pin.outputs.sha }}" "$PATCHES" > release/versions.json
          ls -la release/

      - name: upload dry run
        if: '!inputs.release'
        uses: actions/upload-artifact@v4
        with:
          name: pyodide-patches-dryrun-${{ github.sha }}
          path: release/
          retention-days: 7

      - name: release
        if: inputs.release
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          NOW=$(date -u +%s)
          TAG=$(date -u -d "@$NOW" +%Y%m%d-%H%M)
          NOTES=$(printf 'Pyodide: %s (%s)\nPatches: emitPyodideEvent + asm/wasm loader URL override\n%s\n' \
            "${{ steps.pin.outputs.rev }}" "${{ steps.pin.outputs.sha }}" "$(date -u -d "@$NOW" +%FT%TZ)")
          gh release create "$TAG" release/* \
            --target "$GITHUB_SHA" \
            --title "$TAG" \
            --notes "$NOTES" \
          || gh release upload "$TAG" release/* --clobber
