name: build

on:
  workflow_dispatch:
    inputs:
      pyodide_rev:
        description: "pyodide/pyodide tag/branch/commit to build against"
        type: string
        default: 314.0.3
      release:
        description: "Publish release <yyyymmdd-hhmm> UTC. Off = dry run, artifact only, 7 days."
        type: boolean
        default: false

concurrency:
  group: build
  cancel-in-progress: false

permissions:
  contents: write

env:
  ROOT: /home/runner/pyodide-build
  PYODIDE_REV: ${{ inputs.pyodide_rev }}
  EMSDK_NUM_CORES: 3
  EMCC_CORES: 3
  CCACHE_DIR: /tmp/ccache

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: install system dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y \
            build-essential git xxd \
            ccache autoconf automake libtool libltdl-dev \
            pkg-config texinfo bison ninja-build

      - uses: actions/setup-node@v4
        with:
          node-version: "24"

      - name: install uv
        uses: astral-sh/setup-uv@v5

      - name: cache source + ccache
        uses: actions/cache@v4
        with:
          path: |
            ${{ env.ROOT }}/pyodide
            /tmp/ccache
          key: pyodide-${{ inputs.pyodide_rev }}-${{ hashFiles('scripts/setup.sh', 'patches/*.patch') }}

      - name: setup
        run: bash scripts/setup.sh

      - name: install python
        run: |
          PYVERSION=$(git -C $ROOT/pyodide grep 'export PYVERSION ?=' Makefile.envs | cut -d' ' -f4)
          uv venv --seed --python "$PYVERSION" $ROOT/.venv
          echo "VIRTUAL_ENV=$ROOT/.venv" >> "$GITHUB_ENV"
          echo "$ROOT/.venv/bin" >> "$GITHUB_PATH"
          $ROOT/.venv/bin/python -m pip install -r $ROOT/pyodide/requirements.txt

      - name: build
        run: bash scripts/build.sh

      - name: stage release
        id: v
        run: |
          source scripts/common.sh
          mkdir -p release
          cp $SRC/dist/pyodide.mjs $SRC/dist/pyodide.asm.mjs $SRC/dist/pyodide.asm.wasm release/
          PYODIDE_COMMIT=$(git -C $SRC rev-parse HEAD)
          PATCHES=$(basename -a $REPO/patches/*.patch | jq -R . | jq -s .)
          printf '{"pyodideRev":"%s","pyodideBaseCommit":"%s","patches":%s}' \
            "$PYODIDE_REV" "$PYODIDE_COMMIT" "$PATCHES" > release/versions.json
          echo "pyodide_commit=$PYODIDE_COMMIT" >> "$GITHUB_OUTPUT"
          ls -la release/

      - name: upload dry run
        if: '!inputs.release'
        uses: actions/upload-artifact@v4
        with:
          name: pyodide-patches-dryrun-${{ github.sha }}
          path: release/
          retention-days: 7

      - name: release
        if: inputs.release
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          NOW=$(date -u +%s)
          TAG=$(date -u -d "@$NOW" +%Y%m%d-%H%M)
          NOTES=$(printf 'Pyodide: %s (%s)\nPatches: emitPyodideEvent + asm/wasm loader URL override\n%s\n' \
            "$PYODIDE_REV" "${{ steps.v.outputs.pyodide_commit }}" "$(date -u -d "@$NOW" +%FT%TZ)")
          gh release create "$TAG" release/* \
            --target "$GITHUB_SHA" \
            --title "$TAG" \
            --notes "$NOTES" \
          || gh release upload "$TAG" release/* --clobber
